<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مقاله | Arshia Jadidi</title>
  <!-- ====== css file ====== -->
  <link rel="stylesheet" href="../css/style.css" />
  <!-- ===== bootstrap Icons ====== -->
  <link rel="stylesheet" href="../css/Bootstrap-Icons.css" />
  <!-- ====== Favicon ===== -->
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png" />
  <!-- <link rel="manifest" href="./favicon/site.webmanifest" /> -->
</head>

<body>

  <!-- ====== Navbar ======= -->
  <!-- Same structure as the homepage. Links point back to the
       homepage sections, so they navigate natively without JS. -->
  <nav class="nav" id="nav">
    <div class="section-center nav-center">
      <h3 class="logo">
        <a href="../index.html" class="article-page__logo-link">Arshia Jadidi</a>
      </h3>

      <button class="nav-btn" id="nav-btn" aria-label="باز و بسته کردن منو">
        <i class="bi bi-list-nested"></i>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="../index.html#header" class="nav-link">خانه</a></li>
        <li><a href="../index.html#about" class="nav-link">درباره من</a></li>
        <li><a href="../index.html#projects" class="nav-link">پروژه ها</a></li>
        <li><a href="./Blogs.html" class="nav-link">مقالات</a></li>
      </ul>
    </div>
  </nav>

  <!-- =============
       Article
       ============= -->
  <main class="article-page">
    <article>
      <div class="section-center article-page__center">

        <!-- ====== Featured image ======
             Replace src with the real article image -->
        <figure class="article-page__featured">
          <img
            src="../images/about-img.png"
            alt="تصویر شاخص مقاله"
            class="article-page__featured-img"
          />
        </figure>

        <!-- ====== Article header ====== -->
        <header class="article-page__header">

          <!-- Category label: write the article category inside the anchor -->
          <a href="../index.html#blog" class="article-page__category"><!-- Category text --></a>

          <!-- Article title (H1): write the article title here -->
          <h1 class="article-page__title"><!-- Article title --></h1>

          <!-- Article meta: write the author / publish date / reading
               time inside each text span below -->
          <div class="article-page__meta">
            <span class="article-page__meta-item">
              <i class="bi bi-person"></i>
              <span class="article-page__meta-text"><!-- Author name --></span>
            </span>
            <span class="article-page__meta-item">
              <i class="bi bi-calendar3"></i>
              <span class="article-page__meta-text"><!-- Publish date --></span>
            </span>
            <span class="article-page__meta-item">
              <i class="bi bi-clock"></i>
              <span class="article-page__meta-text"><!-- Reading time --></span>
            </span>
          </div>

          <!-- Short intro or excerpt (optional) -->
          <p class="article-page__excerpt"><!-- Excerpt / short intro --></p>

        </header>

        <!-- ============================================================
             ARTICLE CONTENT
             Write the actual article content inside the container below.
             Every element is a ready-to-use sample of one content type:
             type your text inside the tags, duplicate blocks in any
             order you need, and delete the blocks you do not use.
             Empty elements are hidden automatically and appear with
             full styling as soon as you write text inside them.
             ============================================================ -->
        <div class="article-page__content">

          <!-- H2: main section heading -->
          <h2><!-- Section heading --></h2>

          <!-- P: article paragraph -->
          <p><!-- Paragraph text --></p>

          <!-- H3: sub heading -->
          <h3><!-- Sub heading --></h3>

          <!-- UL: unordered list -->
          <ul>
            <li><!-- List item --></li>
            <li><!-- List item --></li>
          </ul>

          <!-- OL: ordered list (numbered steps) -->
          <ol>
            <li><!-- Step one --></li>
            <li><!-- Step two --></li>
          </ol>

          <!-- BLOCKQUOTE: quote or highlighted note -->
          <blockquote><!-- Quote text --></blockquote>

          <!-- FIGURE: in-article image with caption
               (replace src with your own image) -->
          <figure>
            <img src="../images/about-img.png" alt="توضیح تصویر داخل مقاله" />
            <figcaption><!-- Image caption --></figcaption>
          </figure>

          <!-- Inline code: use it inside a paragraph, for example:
               <p>متن پاراگراف <code>کد خطی</code> ادامه متن</p> -->

          <!-- PRE + CODE: multi-line code block
               (escape < and > inside code with &lt; and &gt;) -->
          <pre><code><!-- Multi-line code --></code></pre>

        </div>

      </div>
    </article>
  </main>

  <!-- ======
   Footer
   ======= -->
  <!-- Same structure as the homepage. Links point back to the
       homepage sections. -->
  <footer class="footer" id="footer">
    <ul class="footer-links">
      <li><a href="../index.html#header" class="footer-link">صفحه اصلی</a></li>
      <li><a href="../index.html#about" class="footer-link">درباره من</a></li>
      <li><a href="../index.html#projects" class="footer-link">پروژه ها</a></li>
      <li><a href="./Blogs.html" class="footer-link">مقالات</a></li>
    </ul>
    <ul class="footer-icons">
      <li>
        <a class="footer-icon" href="#"><i class="bi bi-twitter"></i></a>
      </li>
      <li>
        <a class="footer-icon" href="#"><i class="bi bi-whatsapp"></i></a>
      </li>
      <li>
        <a class="footer-icon" href="#"><i class="bi bi-instagram"></i></a>
      </li>
      <li>
        <a class="footer-icon" href="#"><i class="bi bi-youtube"></i></a>
      </li>
    </ul>
    <p class="copy-write">
      کلیه حقوق نزد ما محفوظ است &#169; <span id="date"></span>
    </p>
  </footer>

  <!-- ===== JavaScript ===== -->
  <script src="../js/app.js"></script>
</body>

</html>
