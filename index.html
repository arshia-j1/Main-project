<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<body>
    <!-- ===== JavaScript ===== -->
    <script src="./app.js"></script>

    <!-- =============

     ============= -->

    <header class="hero">

            <div class="hero-info">

                <span class="hero-subtitle">توسعه دهنده فرانت اند</span>

                </div>
            </div>
        </section>

    <!-- =============
     about
     ============= -->

     <section class="section about">
        <div class="section-center about-center">
            <article class="about-img">
                <div class="img-wramper">
                    <img src="./images/about-img.png" alt=""  class="about-photo">
                    <div class="img-border"></div>
                </div>
            </article>
            <article class="about-info">
                <div class="about-title">
                    <h2>درباره من</h2>
                    <div class="title-line"></div>

                </div>

                <p>هدف من ساخت وب‌سایت‌هایی سریع، تمیز و قابل استفاده در دنیای واقعی است.</p>
                <a href="#" class="btn btn-main">بیشتر درباره من</a>
            </article>
        </div>
